<!doctype html>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#E8FF47}a:hover{color:#F4FFA3}
:focus-visible{outline:2px solid #E8FF47;outline-offset:3px}
</style>
</helmet>
<div style="background: #000000; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column">
<header style="padding: 20px 32px"><a href="#" style="display: inline-flex; align-items: center; gap: 8px; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 18px; letter-spacing: -0.03em"><span style="width: 10px; height: 10px; border-radius: 999px; background: #E8FF47"></span>NeuroCopy</a></header>
<main style="flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 48px 24px 96px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 64px">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.16em; color: #AAAAAA"><span style="width: 8px; height: 8px; border-radius: 999px; background: #E8FF47"></span>CONNEXION</div>
<h1 style="margin: 0; font-size: 64px; line-height: 0.98; letter-spacing: -0.045em; font-weight: 800">Content de te revoir.<br><span style="color: #858585">Ton copy <span style="color: #E8FF47">t'attend.</span></span></h1>
</div>
<form style="flex: 1 1 400px; max-width: 440px; border: 1px solid #2A2A2A; border-radius: 8px; background: #111111; padding: 32px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px"><label for="c-email" style="font-size: 14px; font-weight: 600">Email</label><input id="c-email" type="email" autocomplete="email" placeholder="toi@entreprise.fr" style="height: 52px; padding: 0 16px; border-radius: 8px; border: 1px solid #474747; background: #000000; color: #FFFFFF; font-family: inherit; font-size: 16px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><div style="display: flex; justify-content: space-between; align-items: baseline"><label for="c-mdp" style="font-size: 14px; font-weight: 600">Mot de passe</label><a href="#" style="font-size: 13px; color: #AAAAAA">Mot de passe oublié ?</a></div><input id="c-mdp" type="password" autocomplete="current-password" style="height: 52px; padding: 0 16px; border-radius: 8px; border: 1px solid #474747; background: #000000; color: #FFFFFF; font-family: inherit; font-size: 16px"></div>
<button type="submit" style="margin-top: 6px; height: 52px; border-radius: 999px; border: 0; background: #E8FF47; color: #000000; font-family: inherit; font-weight: 700; font-size: 16px; cursor: pointer">Se connecter →</button>
<div style="display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #858585"><span style="flex: 1; height: 1px; background: #2A2A2A"></span>OU<span style="flex: 1; height: 1px; background: #2A2A2A"></span></div>
<button type="button" style="height: 52px; border-radius: 999px; border: 1px solid #474747; background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer">Recevoir un lien de connexion par email</button>
<p style="margin: 6px 0 0; font-size: 14px; color: #AAAAAA; text-align: center">Pas encore de compte ? <a href="Inscription.dc.html" style="font-weight: 600">Créer mon compte gratuit</a></p>
</form>
</main>
<footer style="padding: 24px 32px; border-top: 1px solid #2A2A2A; font-size: 13px; color: #858585">NeuroCopy · Le copy parle au cerveau, pas à l'œil.</footer>
</div>
</x-dc>
